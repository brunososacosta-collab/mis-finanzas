<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<title>Mis Finanzas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#f5f5f7;color:#111}
.app{max-width:520px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(90px + env(safe-area-inset-bottom))}
h1{font-size:30px;margin:0 0 4px}.month{color:#666;margin-bottom:18px}
.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px #0000000d}
.balance{font-size:34px;font-weight:700;margin:6px 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f5f5f7;border-radius:14px;padding:12px}.label{font-size:13px;color:#777}.value{font-size:19px;font-weight:650;margin-top:4px}
button{border:0;border-radius:14px;padding:13px 15px;font-size:16px;font-weight:600;background:#111;color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.secondary{background:#e9e9ee;color:#111}
select,input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;background:#fff;font-size:16px;margin-top:6px}
.row{margin-bottom:12px}label{font-size:13px;color:#666}.movement{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.movement:last-child{border-bottom:0}
.desc{font-weight:600}.meta{font-size:12px;color:#888;margin-top:3px}.income{color:#16833b}.expense{color:#c22}
.empty{text-align:center;color:#888;padding:20px 0}.delete{background:none;color:#999;padding:4px;font-size:14px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px calc(18px + env(safe-area-inset-right)) calc(25px + env(safe-area-inset-bottom))}.close{float:right;background:#eee;color:#111;padding:7px 11px}
.small{font-size:12px;color:#777;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <h1>Mis Finanzas</h1>
  <div class="month" id="monthLabel"></div>

  <div class="card">
    <div class="label">Disponible</div>
    <div class="balance" id="balance">$0</div>
    <div class="grid">
      <div class="stat"><div class="label">Ingresos</div><div class="value income" id="income">$0</div></div>
      <div class="stat"><div class="label">Gastos</div><div class="value expense" id="expense">$0</div></div>
    </div>
  </div>

  <div class="card">
    <div class="actions">
      <button onclick="openModal('income')">+ Ingreso</button>
      <button onclick="openModal('expense')">+ Gasto</button>
    </div>
  </div>

  <div class="card">
    <div style="font-size:19px;font-weight:700;margin-bottom:8px">Movimientos</div>
    <div id="list"></div>
  </div>
</div>

<div class="modal" id="modal">
 <div class="sheet">
  <button class="close" onclick="closeModal()">Cerrar</button>
  <h2 id="modalTitle">Agregar</h2>
  <form onsubmit="saveMovement(event)">
   <div class="row"><label>Monto</label><input id="amount" type="number" min="0" step="0.01" required placeholder="0"></div>
   <div class="row"><label>Descripción</label><input id="description" required placeholder="Ej. Supermercado"></div>
   <div class="row"><label>Categoría</label>
    <select id="category">
      <option>Vivienda</option><option>Comida</option><option>Nafta</option><option>Transporte</option>
      <option>Servicios</option><option>Salud</option><option>Gimnasio</option><option>Ocio</option>
      <option>Compras</option><option>Otros</option><option>Trabajo</option>
    </select>
   </div>
   <div class="row"><label>Fecha</label><input id="date" type="date" required></div>
   <button style="width:100%;margin-top:4px">Guardar</button>
  </form>
 </div>
</div>

<script>
const KEY='mis_finanzas_v1';
let type='expense';
let data=JSON.parse(localStorage.getItem(KEY)||'[]');

function money(n){return new Intl.NumberFormat('es-UY',{style:'currency',currency:'UYU',maximumFractionDigits:0}).format(n)}
function currentMonth(){return new Date().toISOString().slice(0,7)}
function monthName(){return new Intl.DateTimeFormat('es-UY',{month:'long',year:'numeric'}).format(new Date())}
function render(){
 const m=currentMonth();
 document.getElementById('monthLabel').textContent=monthName();
 const rows=data.filter(x=>x.date.slice(0,7)===m).sort((a,b)=>b.date.localeCompare(a.date));
 const inc=rows.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);
 const exp=rows.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0);
 document.getElementById('income').textContent=money(inc);
 document.getElementById('expense').textContent=money(exp);
 document.getElementById('balance').textContent=money(inc-exp);
 const list=document.getElementById('list');
 if(!rows.length){list.innerHTML='<div class="empty">Todavía no hay movimientos este mes.</div>';return}
 list.innerHTML=rows.map(x=>`<div class="movement">
 <div><div class="desc">${escapeHtml(x.description)}</div><div class="meta">${escapeHtml(x.category)} · ${x.date.split('-').reverse().join('/')}</div></div>
 <div style="text-align:right"><div class="${x.type==='income'?'income':'expense'}">${x.type==='income'?'+':'-'}${money(x.amount)}</div>
 <button class="delete" onclick="removeMovement('${x.id}')">Eliminar</button></div></div>`).join('');
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openModal(t){type=t;document.getElementById('modal').style.display='flex';document.getElementById('modalTitle').textContent=t==='income'?'Nuevo ingreso':'Nuevo gasto';document.getElementById('date').value=new Date().toISOString().slice(0,10);document.getElementById('amount').value='';document.getElementById('description').value='';document.getElementById('description').focus()}
function closeModal(){document.getElementById('modal').style.display='none'}
function saveMovement(e){e.preventDefault();data.push({id:crypto.randomUUID(),type,amount:Number(document.getElementById('amount').value),description:document.getElementById('description').value.trim(),category:document.getElementById('category').value,date:document.getElementById('date').value});localStorage.setItem(KEY,JSON.stringify(data));closeModal();render()}
function removeMovement(id){if(confirm('¿Eliminar este movimiento?')){data=data.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(data));render()}}
render();
</script>
</body>
</html>
